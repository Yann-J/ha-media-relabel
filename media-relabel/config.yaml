# Media Relabel add-on for Home Assistant OS
name: Media Relabel
version: "1.0.4"
slug: media-relabel
description: One-shot tool - relabels a disk partition and can run arbitrary prep commands
arch:
  - amd64
protected: false
startup: once
boot: manual
init: false
full_access: true
devices:
  - /dev/sdb1
  - /dev/sdb
  - /dev/nvme0n1
build:
  dockerfile: Dockerfile
hassio_api: false
host_network: false
map:
  - media:rw
options: {}
schema: {}
